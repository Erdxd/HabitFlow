<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование логина</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1e2f, #2b2b45);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .edit-card {
            width: 420px;
            padding: 32px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .title {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
        }

        .field input {
            height: 44px;
            padding: 0 14px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 14px;
            background: rgba(255,255,255,0.15);
            color: #fff;
        }

        .field input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .actions {
            margin-top: 8px;
        }

        .save-btn {
            width: 100%;
            height: 44px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #6c63ff, #857dff);
        }

        .back {
            text-align: center;
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="edit-card">

    <div class="title">Редактировать логин</div>

    <form action="/redact" method="post">

        <div class="field">
            <label>Новый логин</label>
            <input
                type="text"
                name="new_login"
                placeholder="Введите новый логин"
                required
            >
        </div>

        <div class="field">
            <label>Подтвердите пароль</label>
            <input
                type="password"
                name="password"
                placeholder="Введите пароль"
                required
            >
        </div>

        <div class="actions">
            <button class="save-btn">Сохранить</button>
        </div>

    </form>

    <div class="back" onclick="history.back()">
        ← Назад в профиль
    </div>

</div>

</body>
</html>
