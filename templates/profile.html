<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1e2f, #2b2b45);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .profile-card {
            width: 720px;
            padding: 32px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 32px;
        }

        .left {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            border-right: 1px solid rgba(255,255,255,0.15);
            padding-right: 24px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .userid {
            background: rgba(255,255,255,0.15);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
        }

        .tg-link {
            font-size: 13px;
            color: #a8a5ff;
            text-decoration: none;
        }

        .tg-link:hover {
            text-decoration: underline;
        }

        .right {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .title {
            font-size: 22px;
            font-weight: 600;
        }

        .data-block {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 12px;
            padding: 16px;
            border-radius: 12px;
            background: rgba(255,255,255,0.12);
            font-size: 14px;
        }

        .data-block span:nth-child(odd) {
            color: rgba(255,255,255,0.7);
        }

        .password {
            cursor: pointer;
            letter-spacing: 2px;
            user-select: none;
        }

        .password:hover {
            color: #a8a5ff;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .edit-btn, .back-btn {
            height: 44px;
            padding: 0 22px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .edit-btn {
            background: linear-gradient(135deg, #6c63ff, #857dff);
        }

        .back-btn {
            background: rgba(255,255,255,0.15);
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.25);
        }
    </style>
</head>
<body>

{{range .DataAll}}
<div class="profile-card">

    <div class="left">
        <div class="avatar">👤</div>

        <div class="userid">
            User ID: <b>{{.Id_user}}</b>
        </div>

        <a class="tg-link" href="https://t.me/HabitFlowTracker_bot" target="_blank">
             Telegram-бот 
        </a>
    </div>

    <div class="right">
        <div class="title">Личный кабинет</div>

        <div class="data-block">
            <span>Логин</span>
            <span>{{.Username}}</span>

            <span>Email</span>
            <span>{{.Email}}</span>

            <span>Пароль</span>
            <span
                class="password"
                data-password="{{.Password}}"
                onclick="togglePassword(this)"
            >
                ••••••••
            </span>
        </div>

        <div class="actions">
            <form action="/edit" method="get">
                <button class="edit-btn">Редактировать данные</button>
            </form>

            <form action="/" method="get">
                <button class="back-btn">Назад</button>
            </form>
        </div>
    </div>

</div>
{{end}}

<script>
function togglePassword(el) {
    const real = el.dataset.password;
    el.textContent = el.textContent.includes("•") ? real : "••••••••";
}
</script>

</body>
</html>
