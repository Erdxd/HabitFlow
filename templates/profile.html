<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1e2f, #2b2b45);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .profile-card {
            width: 720px;
            padding: 32px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 32px;
        }

        /* LEFT */
        .left {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            border-right: 1px solid rgba(255,255,255,0.15);
            padding-right: 24px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .userid {
            background: rgba(255,255,255,0.15);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
        }

        /* RIGHT */
        .right {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .title {
            font-size: 22px;
            font-weight: 600;
        }

        .data-block {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 12px;
            padding: 14px;
            border-radius: 12px;
            background: rgba(255,255,255,0.12);
            font-size: 14px;
        }

        .data-block span:first-child {
            color: rgba(255,255,255,0.7);
        }

        .actions {
            margin-top: 8px;
        }

        .edit-btn {
            height: 44px;
            padding: 0 24px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #fff;

            background: linear-gradient(135deg, #6c63ff, #857dff);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .edit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(108, 99, 255, 0.35);
        }

        @media (max-width: 768px) {
            .profile-card {
                grid-template-columns: 1fr;
            }

            .left {
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.15);
                padding-bottom: 24px;
            }
        }
    </style>
</head>
<body>

<div class="profile-card">

    
    <div class="left">
        <div class="avatar">👤</div>

        <div class="userid">
            User ID: <b>{{.UserID}}</b>
        </div>
    </div>
    

    
    <div class="right">
        <div class="title">Личный кабинет</div>

        <div class="data-block">
            <span>Логин</span>
            <span>{{.Login}}</span>

            <span>Email</span>
            <span>{{.Email}}</span>

            <span>Пароль</span>
            <span>••••••••</span>
        </div>

        <div class="actions">
            <form action="/edit" method="get">
                <button class="edit-btn">
                    Редактировать данные
                </button>
            </form>
        </div>
    </div>

</div>

</body>
</html>
