<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitFlow</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1e2f, #2b2b45);
            display: flex;
            justify-content: center;
            padding: 40px 16px;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 24px;
        }

        .add-card {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .add-card h3 {
            text-align: center;
        }

        label {
            font-size: 13px;
            color: rgba(255,255,255,0.8);
        }

        .field {
            height: 42px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            overflow: hidden;
        }

        .field input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 0 12px;
            color: #fff;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .submit-btn {
            height: 42px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #6c63ff, #857dff);
            color: #fff;
            font-weight: 600;
        }

        .list-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .habit {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .habit.completed {
            opacity: 0.6;
        }

        .habit-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .habit-info span {
            font-size: 13px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            color: #fff;
            background: rgba(255,255,255,0.2);
        }

        .btn.delete {
            background: rgba(255, 80, 80, 0.6);
        }

        .btn.change {
            background: rgba(108, 99, 255, 0.6);
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .add-card {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">

    
    <form action="/add" method="post" class="card add-card">
        <h3>Добавить привычку</h3>

        <label>ID</label>
        <div class="field">
            <input type="number" min="1" name="Id" required>
        </div>

        <label>Привычка</label>
        <div class="field">
            <input type="text" name="Habit_Name" required>
        </div>

        <label>Дней подряд</label>
        <div class="field">
            <input type="number" min="0" name="Streak" required>
        </div>

        <div class="checkbox">
            <input type="checkbox" name="Status_Today">
            <label>Выполнено сегодня</label>
        </div>

        <button type="submit" class="submit-btn">Добавить</button>
    </form>

    
    <div class="card list-card">
        <h3>Список привычек</h3>

        {{range .HabitAll}}
        <div class="habit {{if .Status_Today}}completed{{end}}">
            <div class="habit-info">
                <span><b>{{.Habit_Name}}</b></span>
                <span>ID: {{.Id}} · Дней подряд: {{.Streak}}</span>
                <span>Статус: {{if .Status_Today}}Выполнено{{else}}Не выполнено{{end}}</span>
            </div>

            <div class="actions">
                <form action="/change" method="post">
                    <input type="hidden" name="Id" value="{{.Id}}">
                    <input type="hidden" name="Streak" value="{{.Streak}}">
                    <button class="btn change">Сегодня</button>
                </form>

                <form action="/delete" method="post">
                    <input type="hidden" name="Id" value="{{.Id}}">
                    <button class="btn delete">Удалить</button>
                </form>
            </div>
        </div>
        {{end}}

    </div>

</div>
<p>Ваш аккаунт <a href="/profile">Просмотреть</a></p>

</body>
</html>
